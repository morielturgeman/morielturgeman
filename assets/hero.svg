<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img" aria-label="Moriel Turgeman — Agentic AI, Deep Learning, Computer Vision">
  <title>Moriel Turgeman — Agentic AI · Deep Learning · Computer Vision</title>

  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>

    <linearGradient id="nameGrad" spreadMethod="reflect"
                    gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="420" y2="0">
      <stop offset="0%"   stop-color="#e6edf3"/>
      <stop offset="45%"  stop-color="#e6edf3"/>
      <stop offset="55%"  stop-color="#79c0ff"/>
      <stop offset="70%"  stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#e6edf3"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-460 0; 460 0; -460 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="150" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-160 0; 400 0; -160 0" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>

    <clipPath id="l1"><rect x="30" y="236" width="0" height="20">
      <animate attributeName="width" values="0;0;180;180" keyTimes="0;0.06;0.20;1" dur="13s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="l2"><rect x="30" y="260" width="0" height="20">
      <animate attributeName="width" values="0;0;236;236" keyTimes="0;0.22;0.38;1" dur="13s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="l3"><rect x="30" y="284" width="0" height="20">
      <animate attributeName="width" values="0;0;300;300" keyTimes="0;0.40;0.58;1" dur="13s" repeatCount="indefinite"/>
    </rect></clipPath>

    <clipPath id="panel"><rect x="626" y="66" width="212" height="212" rx="8"/></clipPath>
  </defs>

  <style>
    .m   { font-family:"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .p   { fill:#3fb950; font-size:15px; }
    .cmd { fill:#c9d1d9; font-size:15px; }
    .nm  { font-size:37px; font-weight:700; letter-spacing:3px; }
    .sub { fill:#8b949e; font-size:14px; letter-spacing:.6px; }
    .ln  { fill:#8b949e; font-size:15px; }
    .ac  { fill:#58a6ff; }
    .dim { fill:#6e7681; font-size:12.5px; }
    .tag { fill:#7d8590; font-size:11px; letter-spacing:1.4px; }
  </style>

  <!-- window -->
  <rect x="1" y="1" width="878" height="338" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <path d="M1 13a12 12 0 0 1 12-12h854a12 12 0 0 1 12 12v27H1z" fill="#161b22"/>
  <line x1="1" y1="40" x2="879" y2="40" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="26" cy="20.5" r="5.5" fill="#ff5f57"/>
  <circle cx="46" cy="20.5" r="5.5" fill="#febc2e"/>
  <circle cx="66" cy="20.5" r="5.5" fill="#28c840"/>
  <text class="m dim" x="440" y="25" text-anchor="middle">moriel@ml-lab — ~/research</text>

  <!-- prompt + name -->
  <text class="m" x="30" y="78"><tspan class="p">$</tspan><tspan class="cmd" dx="9">whoami</tspan></text>
  <text class="m nm" x="30" y="128" fill="url(#nameGrad)">MORIEL TURGEMAN</text>

  <rect x="30" y="142" width="360" height="2.5" rx="1.25" fill="url(#edge)"/>
  <rect x="30" y="142" width="360" height="2.5" rx="1.25" fill="url(#sweep)"/>

  <text class="m sub" x="30" y="170">Agentic AI<tspan fill="#484f58"> · </tspan>LLM Systems<tspan fill="#484f58"> · </tspan>Deep Learning<tspan fill="#484f58"> · </tspan>Computer Vision</text>

  <text class="m" x="30" y="212"><tspan class="p">$</tspan><tspan class="cmd" dx="9">cat focus.txt</tspan></text>

  <g clip-path="url(#l1)"><text class="m ln" x="30" y="251"><tspan class="ac">&gt;</tspan> train the model</text></g>
  <g clip-path="url(#l2)"><text class="m ln" x="30" y="275"><tspan class="ac">&gt;</tspan> evaluate what it learned</text></g>
  <g clip-path="url(#l3)"><text class="m ln" x="30" y="299"><tspan class="ac">&gt;</tspan> ship it behind an API</text></g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.575;0.58;1" dur="13s" repeatCount="indefinite"/>
    <rect x="332" y="286" width="9" height="16" fill="#3fb950">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.49;0.5;0.99;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- super-resolution motif: coarse pixel grid resolving into a fine one -->
  <rect x="626" y="66" width="212" height="212" rx="8" fill="#010409" stroke="#30363d"/>
  <g clip-path="url(#panel)">
    <!-- fine layer -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.42;0.5;0.92;1" dur="6s" repeatCount="indefinite"/>
      <g fill="#1f6feb">
        <rect x="626" y="66" width="26.5" height="26.5" opacity=".25"/><rect x="679" y="66" width="26.5" height="26.5" opacity=".55"/>
        <rect x="732" y="92.5" width="26.5" height="26.5" opacity=".75"/><rect x="785" y="66" width="26.5" height="26.5" opacity=".35"/>
        <rect x="652.5" y="119" width="26.5" height="26.5" opacity=".85"/><rect x="705.5" y="145.5" width="26.5" height="26.5" opacity=".95"/>
        <rect x="758.5" y="119" width="26.5" height="26.5" opacity=".6"/><rect x="811.5" y="172" width="26.5" height="26.5" opacity=".4"/>
        <rect x="626" y="198.5" width="26.5" height="26.5" opacity=".5"/><rect x="679" y="225" width="26.5" height="26.5" opacity=".7"/>
        <rect x="732" y="198.5" width="26.5" height="26.5" opacity=".3"/><rect x="785" y="251.5" width="26.5" height="26.5" opacity=".65"/>
      </g>
      <g stroke="#30363d" stroke-width=".6" opacity=".55">
        <path d="M652.5 66V278M679 66V278M705.5 66V278M732 66V278M758.5 66V278M785 66V278M811.5 66V278"/>
        <path d="M626 92.5H838M626 119H838M626 145.5H838M626 172H838M626 198.5H838M626 225H838M626 251.5H838"/>
      </g>
    </g>
    <!-- coarse layer -->
    <g opacity="1">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.42;0.5;0.92;1" dur="6s" repeatCount="indefinite"/>
      <g fill="#1f6feb">
        <rect x="626" y="66" width="53" height="53" opacity=".4"/><rect x="732" y="66" width="53" height="53" opacity=".55"/>
        <rect x="679" y="119" width="53" height="53" opacity=".9"/><rect x="785" y="119" width="53" height="53" opacity=".45"/>
        <rect x="626" y="172" width="53" height="53" opacity=".6"/><rect x="732" y="225" width="53" height="53" opacity=".5"/>
      </g>
      <g stroke="#30363d" stroke-width=".8" opacity=".7">
        <path d="M679 66V278M732 66V278M785 66V278"/>
        <path d="M626 119H838M626 172H838M626 225H838"/>
      </g>
    </g>
    <!-- scan line -->
    <rect x="626" y="66" width="212" height="2" fill="#58a6ff" opacity=".9">
      <animate attributeName="y" values="66;276;66" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".9;.9;.15;.9" keyTimes="0;0.45;0.5;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text class="m tag" x="732" y="296" text-anchor="middle">×4 SUPER-RESOLUTION</text>
</svg>
